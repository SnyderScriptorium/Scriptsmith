[package]
name = "scriptsmith"
version = "0.1.0"
description = "ScriptSmith offline writing studio"
authors = ["Snyder Scriptorium"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "scriptsmith_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "2.4"

[dependencies]
tauri = { version = "2.8", features = [] }
tauri-plugin-dialog = "2.7"
tauri-plugin-fs = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
