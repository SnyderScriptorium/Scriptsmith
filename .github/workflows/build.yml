name: ScriptSmith build

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build

  windows:
    name: Windows desktop build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Create valid Windows icon
        shell: pwsh
        run: |
          python -m pip install --quiet pillow
          New-Item -ItemType Directory -Force src-tauri/icons | Out-Null
          @'
          from PIL import Image, ImageDraw
          from pathlib import Path
          out = Path("src-tauri/icons/icon.ico")
          img = Image.new("RGBA", (256, 256), (0, 0, 0, 0))
          d = ImageDraw.Draw(img)
          d.rounded_rectangle((8, 8, 248, 248), radius=36, fill=(30, 30, 30, 255))
          d.rectangle((48, 54, 208, 202), fill=(245, 245, 245, 255))
          d.rectangle((64, 72, 192, 88), fill=(70, 70, 70, 255))
          d.rectangle((64, 104, 176, 116), fill=(100, 100, 100, 255))
          d.rectangle((64, 130, 192, 142), fill=(100, 100, 100, 255))
          d.rectangle((64, 156, 160, 168), fill=(100, 100, 100, 255))
          img.save(out, format="ICO", sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])
          '@ | Set-Content create_icon.py
          python create_icon.py
      - run: npm install
      - run: npm run tauri -- build
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: scriptsmith-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "ScriptSmith $TAG" --generate-notes
          gh release upload "$TAG" src-tauri/target/release/bundle/nsis/*.exe src-tauri/target/release/bundle/msi/*.msi --clobber
