name: Normalize pagination architecture

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove duplicate app pagination engine
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/app.js')
          text = path.read_text(encoding='utf-8')

          # Remove the legacy nested pagination function by balanced-brace parsing.
          marker = 'function paginate('
          start = text.find(marker)
          if start < 0:
              print('Legacy paginate() already absent.')
          else:
              brace = text.find('{', start)
              if brace < 0:
                  raise SystemExit('paginate() found without opening brace')
              depth = 0
              quote = None
              escape = False
              end = None
              for i in range(brace, len(text)):
                  ch = text[i]
                  if quote:
                      if escape:
                          escape = False
                      elif ch == '\\\\':
                          escape = True
                      elif ch == quote:
                          quote = None
                      continue
                  if ch in "'\"`":
                      quote = ch
                  elif ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break
              if end is None:
                  raise SystemExit('Could not balance paginate() braces')
              text = text[:start] + text[end:]

          # Remove direct calls left behind by the deleted legacy engine.
          text = re.sub(r'(?<![\w$])paginate\(\);?', '', text)
          path.write_text(text, encoding='utf-8')
          PY

          # Verify the duplicate engine is actually gone before committing.
          if grep -n "function paginate\|paginate();" src/app.js; then
            echo 'Legacy pagination references remain.'
            exit 1
          fi

          # Remove this temporary workflow in the same commit so it does not remain in the project.
          rm -f .github/workflows/normalize-pagination.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app.js .github/workflows/normalize-pagination.yml
          git commit -m 'Fix pagination architecture: remove duplicate engine' || exit 0
          git push
